# config.ini — NEW LOAD MODEL configuration
# Used by implementation_load.py at inference time.
#
# IMPORTANT:
#   data_min / data_max are the min and max of the RAW training load values
#   (NOT differenced). These must be updated after training completes —
#   train_load.py prints them and saves them in scaler_params.json.
#
#   Unlike the old model, there is NO daily_lag parameter because
#   seasonal differencing has been removed entirely.

[Model]
# Placeholder values — REPLACE with actual values from training output
data_min = 0.0
data_max = 1.0
feature_range_min = -1.0
feature_range_max = 1.0
sequence_length = 96
n_input_features = 8
use_time_features = true

[Data]
dataset_kind = load

[Paths]
impl_path = implementation
